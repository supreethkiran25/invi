<!doctype html>

  <head>

    <link rel="preconnect" href="https://cdn.shopify.com" crossorigin />

    <!-- Critical Above-The-Fold Inline CSS (Instant Paint under 300ms) -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; min-height: 100%; background-color: #0F0F0F; color: #FAF9F6; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow-x: hidden; }
      #root { width: 100%; min-height: 100vh; position: relative; }
      .critical-hero-stage { position: relative; width: 100%; height: 100vh; height: 100dvh; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 64px; overflow: hidden; background: #0F0F0F; }
      .critical-hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 15%; filter: brightness(0.92); }
      .critical-hero-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.05) 25%, rgba(0,0,0,0.18) 55%, rgba(0,0,0,0.7) 80%, rgba(0,0,0,0.9) 100%); pointer-events: none; }
      .critical-hero-content { position: relative; z-index: 5; text-align: center; max-width: 860px; padding: 0 16px; margin-bottom: 12px; }
      .critical-tag { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em; color: #B35436; text-transform: uppercase; margin-bottom: 8px; }
      .critical-title { font-size: clamp(2.2rem, 5vw, 3.8rem); font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; text-transform: uppercase; color: #FFFFFF; margin-bottom: 10px; text-shadow: 0 2px 14px rgba(0,0,0,0.7); }
      .critical-desc { font-size: clamp(0.85rem, 1.4vw, 1rem); color: #EAEAEA; max-width: 580px; margin: 0 auto 20px auto; line-height: 1.5; opacity: 0.95; }
      .critical-cta-row { display: flex; align-items: center; justify-content: center; gap: 14px; }
      .critical-btn { min-width: 170px; height: 48px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
      .critical-btn-white { background: #FFFFFF; color: #0A0A0A; border: none; }
      .critical-btn-outline { background: transparent; color: #FFFFFF; border: 1px solid rgba(255,255,255,0.4); }
      .critical-header { position: fixed; top: 0; left: 0; right: 0; width: 100%; height: 64px; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid rgba(255,255,255,0.15); }
      .critical-logo { font-size: 1.5rem; font-weight: 900; letter-spacing: 0.1em; color: #FAF9F6; text-decoration: none; }
      @media (max-width: 768px) {
        .critical-hero-stage { padding-bottom: 50px; }
        .critical-hero-img { object-position: center 4%; }
        .critical-header { padding: 0 16px; }
        .critical-btn { min-width: 140px; height: 44px; font-size: 0.72rem; }
      }
    </style>
